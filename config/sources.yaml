    name: American Community Survey Public Use Microdata Sample
    agency: U.S. Census Bureau / IPUMS USA
    landing_page: https://usa.ipums.org/usa-action/samples/sample_ids
    access: licensed_api
    credential: IPUMS_API_KEY
    adapter: acs_pums
    implemented: true
    record_unit: person
    update_cadence: annual
  cps_asec:
    name: Current Population Survey Annual Social and Economic Supplement
    agency: U.S. Census Bureau / IPUMS CPS
    landing_page: https://cps.ipums.org/cps-action/samples/sample_ids
    access: licensed_api
    credential: IPUMS_API_KEY
    adapter: cps_asec
    implemented: true
    record_unit: person
    update_cadence: annual
  atus:
