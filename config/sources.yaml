    adapter: scf
    implemented: true
    record_unit: primary_economic_unit
    update_cadence: triennial
    required_roles:
      - full_data_stata
      - replicate_weights_stata
      - summary_extract_csv
      - summary_extract_stata
      - codebook
      - standard_error_documentation
      - changes
      - variable_definitions
