<!doctype html>
<html lang="en" data-diagram-design-version="2.3">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="diagram-design-source" content="https://github.com/cathrynlavery/diagram-design@a5e3978088cf89c7caff5c20cabd99fbc2a301de">
  <title>Microdata Lab evidence flow</title>
  <style>
    @font-face { font-family: Jost; src: url("../../viz/assets/fonts/Jost-Regular.ttf"); font-weight: 400; }
    @font-face { font-family: Jost; src: url("../../viz/assets/fonts/Jost-SemiBold.ttf"); font-weight: 600; }
    * { box-sizing: border-box; }
    html, body { width: 960px; height: 600px; margin: 0; overflow: hidden; background: #F7F5EF; }
    svg { display: block; width: 960px; height: 600px; }
    .human { font-family: Jost, Arial, sans-serif; }
    .editorial { font-family: Georgia, "Times New Roman", serif; }
    .technical { font-family: ui-monospace, "DejaVu Sans Mono", monospace; }
  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="microdata-flow-title microdata-flow-desc" width="960" height="600" viewBox="0 0 960 600">
  <title id="microdata-flow-title">Microdata Lab evidence flow</title>
  <desc id="microdata-flow-desc">Official agency data enter a unique incoming run, pass validation gates, become an immutable release, support a weighted estimate and output artifacts, and pass publication quality assurance. Validation failures route to a visible blocker and are never silently substituted.</desc>
  <defs>
    <marker id="microdata-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#65727E"/></marker>
    <marker id="microdata-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3A6EA5"/></marker>
    <marker id="microdata-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#087F7A"/></marker>
    <marker id="microdata-flow-arrow-fail" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#D64B5E"/></marker>
  </defs>

  <rect width="960" height="600" fill="#F7F5EF"/>
  <text x="40" y="34" class="technical" fill="#087F7A" font-size="9" font-weight="600" letter-spacing="0.18em">MICRODATA LAB · EVIDENCE PATH</text>
  <text x="40" y="76" class="editorial" fill="#1D252C" font-size="29">From agency release to public claim</text>
  <text x="40" y="98" class="human" fill="#65727E" font-size="12">Every handoff preserves provenance; every failed gate stays visible.</text>

  <!-- Five steps: simplified detail for README readability. -->
  <g class="technical" text-anchor="middle">
    <g><rect x="218" y="112" width="32" height="18" rx="9" fill="rgba(29,37,44,0.10)"/><text x="234" y="125" fill="#1D252C" font-size="8.5" font-weight="600">01</text><text x="234" y="146" fill="#65727E" font-size="8" letter-spacing="0.10em">ACQUIRE</text></g>
    <g><rect x="374" y="112" width="32" height="18" rx="9" fill="rgba(29,37,44,0.10)"/><text x="390" y="125" fill="#1D252C" font-size="8.5" font-weight="600">02</text><text x="390" y="146" fill="#65727E" font-size="8" letter-spacing="0.10em">VALIDATE</text></g>
    <g><rect x="530" y="112" width="32" height="18" rx="9" fill="rgba(29,37,44,0.10)"/><text x="546" y="125" fill="#1D252C" font-size="8.5" font-weight="600">03</text><text x="546" y="146" fill="#65727E" font-size="8" letter-spacing="0.10em">PROMOTE</text></g>
    <g><rect x="686" y="112" width="32" height="18" rx="9" fill="rgba(8,127,122,0.15)" stroke="#087F7A" stroke-width="0.8"/><text x="702" y="125" fill="#087F7A" font-size="8.5" font-weight="600">04</text><text x="702" y="146" fill="#087F7A" font-size="8" font-weight="600" letter-spacing="0.10em">ESTIMATE</text></g>
    <g><rect x="842" y="112" width="32" height="18" rx="9" fill="rgba(29,37,44,0.10)"/><text x="858" y="125" fill="#1D252C" font-size="8.5" font-weight="600">05</text><text x="858" y="146" fill="#65727E" font-size="8" letter-spacing="0.10em">REVIEW</text></g>
  </g>

  <!-- Lane structure -->
  <rect x="148" y="156" width="788" height="76" fill="rgba(29,37,44,0.018)"/>
  <rect x="148" y="308" width="788" height="76" fill="rgba(29,37,44,0.018)"/>
  <rect x="148" y="384" width="788" height="76" fill="rgba(214,75,94,0.025)"/>
  <g stroke="rgba(29,37,44,0.12)" stroke-width="0.8">
    <line x1="40" y1="156" x2="936" y2="156"/><line x1="40" y1="232" x2="936" y2="232"/>
    <line x1="40" y1="308" x2="936" y2="308"/><line x1="40" y1="384" x2="936" y2="384"/>
    <line x1="40" y1="460" x2="936" y2="460"/><line x1="148" y1="156" x2="148" y2="460"/>
  </g>
  <g class="technical" fill="#65727E" font-size="9" font-weight="600" letter-spacing="0.12em" text-anchor="middle">
    <text x="78" y="191">OFFICIAL</text><text x="78" y="203">SOURCE</text>
    <text x="78" y="267">RELEASE</text><text x="78" y="279">SYSTEM</text>
    <text x="78" y="343">ANALYSIS</text><text x="78" y="355">+ OUTPUT</text>
    <text x="78" y="423" fill="#D64B5E">VISIBLE FAILURE</text>
  </g>

  <!-- Connectors: drawn before nodes. -->
  <line x1="234" y1="226" x2="234" y2="238" stroke="#3A6EA5" stroke-width="1.4" marker-end="url(#microdata-flow-arrow-link)"/>
  <line x1="300" y1="270" x2="324" y2="270" stroke="#65727E" stroke-width="1.2" marker-end="url(#microdata-flow-arrow)"/>
  <line x1="456" y1="270" x2="480" y2="270" stroke="#65727E" stroke-width="1.2" marker-end="url(#microdata-flow-arrow)"/>
  <path d="M612 270 H686 Q702 270 702 286 V314" fill="none" stroke="#087F7A" stroke-width="1.6" marker-end="url(#microdata-flow-arrow-accent)"/>
  <line x1="768" y1="346" x2="792" y2="346" stroke="#65727E" stroke-width="1.2" marker-end="url(#microdata-flow-arrow)"/>
  <line x1="390" y1="302" x2="390" y2="390" stroke="#D64B5E" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#microdata-flow-arrow-fail)"/>
  <rect x="624" y="250" width="92" height="14" rx="2" fill="#F7F5EF"/>
  <text x="670" y="260" class="technical" fill="#087F7A" font-size="7.5" text-anchor="middle" letter-spacing="0.05em">VALIDATED TABLE</text>

  <!-- Nodes -->
  <g data-node="official-source">
    <rect x="168" y="162" width="132" height="64" rx="6" fill="rgba(58,110,165,0.05)" stroke="rgba(58,110,165,0.55)"/>
    <rect x="176" y="169" width="30" height="14" rx="2" fill="rgba(58,110,165,0.12)"/><text x="191" y="179" class="technical" fill="#3A6EA5" font-size="7" font-weight="600" text-anchor="middle">WEB</text>
    <text x="234" y="196" class="human" fill="#1D252C" font-size="13.5" font-weight="600" text-anchor="middle">Official source</text>
    <text x="234" y="214" class="technical" fill="#65727E" font-size="9" text-anchor="middle">agency URL · API</text>
  </g>
  <g data-node="incoming-run">
    <rect x="168" y="238" width="132" height="64" rx="6" fill="#F7F5EF" stroke="rgba(29,37,44,0.38)"/>
    <rect x="176" y="245" width="30" height="14" rx="2" fill="rgba(29,37,44,0.09)"/><text x="191" y="255" class="technical" fill="#65727E" font-size="7" font-weight="600" text-anchor="middle">RUN</text>
    <text x="234" y="272" class="human" fill="#1D252C" font-size="13.5" font-weight="600" text-anchor="middle">Incoming run</text>
    <text x="234" y="290" class="technical" fill="#65727E" font-size="9" text-anchor="middle">unique · checksummed</text>
  </g>
  <g data-node="validation-gates">
    <rect x="324" y="238" width="132" height="64" rx="6" fill="#F7F5EF" stroke="rgba(29,37,44,0.38)"/>
    <rect x="332" y="245" width="34" height="14" rx="2" fill="rgba(29,37,44,0.09)"/><text x="349" y="255" class="technical" fill="#65727E" font-size="7" font-weight="600" text-anchor="middle">GATE</text>
    <text x="390" y="272" class="human" fill="#1D252C" font-size="13.5" font-weight="600" text-anchor="middle">Validation</text>
    <text x="390" y="290" class="technical" fill="#65727E" font-size="9" text-anchor="middle">artifacts · benchmark</text>
  </g>
  <g data-node="immutable-release">
    <rect x="480" y="238" width="132" height="64" rx="6" fill="rgba(29,37,44,0.04)" stroke="#65727E"/>
    <rect x="488" y="245" width="38" height="14" rx="2" fill="rgba(29,37,44,0.09)"/><text x="507" y="255" class="technical" fill="#65727E" font-size="7" font-weight="600" text-anchor="middle">STORE</text>
    <text x="546" y="272" class="human" fill="#1D252C" font-size="13.5" font-weight="600" text-anchor="middle">Immutable release</text>
    <text x="546" y="290" class="technical" fill="#65727E" font-size="9" text-anchor="middle">revision preserved</text>
  </g>
  <g data-node="estimate-and-outputs">
    <rect x="636" y="314" width="132" height="64" rx="6" fill="rgba(8,127,122,0.09)" stroke="#087F7A" stroke-width="1.6"/>
    <rect x="644" y="321" width="30" height="14" rx="2" fill="rgba(8,127,122,0.16)"/><text x="659" y="331" class="technical" fill="#087F7A" font-size="7" font-weight="600" text-anchor="middle">EST</text>
    <text x="702" y="348" class="human" fill="#1D252C" font-size="13.5" font-weight="600" text-anchor="middle">Estimate + outputs</text>
    <text x="702" y="366" class="technical" fill="#65727E" font-size="9" text-anchor="middle">weight · design · charts</text>
  </g>
  <g data-node="publication-qa">
    <rect x="792" y="314" width="132" height="64" rx="6" fill="#F7F5EF" stroke="rgba(29,37,44,0.38)"/>
    <rect x="800" y="321" width="30" height="14" rx="2" fill="rgba(29,37,44,0.09)"/><text x="815" y="331" class="technical" fill="#65727E" font-size="7" font-weight="600" text-anchor="middle">QA</text>
    <text x="858" y="348" class="human" fill="#1D252C" font-size="13.5" font-weight="600" text-anchor="middle">Publication QA</text>
    <text x="858" y="366" class="technical" fill="#65727E" font-size="9" text-anchor="middle">stats · pixels · access</text>
  </g>
  <g data-node="visible-blocker">
    <rect x="324" y="390" width="132" height="64" rx="6" fill="rgba(214,75,94,0.06)" stroke="rgba(214,75,94,0.70)" stroke-dasharray="4 3"/>
    <rect x="332" y="397" width="34" height="14" rx="2" fill="rgba(214,75,94,0.13)"/><text x="349" y="407" class="technical" fill="#D64B5E" font-size="7" font-weight="600" text-anchor="middle">STOP</text>
    <text x="390" y="424" class="human" fill="#D64B5E" font-size="13.5" font-weight="600" text-anchor="middle">Visible blocker</text>
    <text x="390" y="442" class="technical" fill="#65727E" font-size="9" text-anchor="middle">no silent substitute</text>
  </g>

  <!-- Payload shapes and provenance live in the legend, not inside small nodes. -->
  <line x1="40" y1="488" x2="920" y2="488" stroke="rgba(29,37,44,0.16)"/>
  <g class="technical" font-size="8.5" fill="#65727E">
    <text x="40" y="515" font-weight="600" letter-spacing="0.12em">PAYLOADS</text>
    <rect x="126" y="502" width="24" height="14" rx="2" fill="#6E6479"/><text x="138" y="512" fill="#F7F5EF" font-size="7" text-anchor="middle">WB</text><text x="160" y="514">public web/API</text>
    <rect x="286" y="502" width="24" height="14" rx="2" fill="#5E7A9B"/><text x="298" y="512" fill="#F7F5EF" font-size="7" text-anchor="middle">DB</text><text x="320" y="514">raw dataset</text>
    <rect x="428" y="502" width="24" height="14" rx="2" fill="#B8915A"/><text x="440" y="512" fill="#F7F5EF" font-size="7" text-anchor="middle">TB</text><text x="462" y="514">analysis table</text>
    <rect x="580" y="502" width="24" height="14" rx="2" fill="#9C6B50"/><text x="592" y="512" fill="#F7F5EF" font-size="7" text-anchor="middle">FL</text><text x="614" y="514">artifact</text>
    <line x1="724" y1="509" x2="762" y2="509" stroke="#087F7A" stroke-width="2"/><text x="774" y="514">focal handoff</text>
    <line x1="40" y1="543" x2="78" y2="543" stroke="#D64B5E" stroke-width="1.5" stroke-dasharray="5 4"/><text x="90" y="547">failed validation stops promotion and remains reportable</text>
    <text x="920" y="576" text-anchor="end" fill="#87919A">diagram-design 2.3 · Microdata Lab editorial skin</text>
  </g>
</svg>
</body>
</html>
